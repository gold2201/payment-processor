[tool.poetry]
name = "payment-processor"
version = "0.1.0"
description = "Async payment processing microservice"
authors = ["Author <author@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"

fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"

sqlalchemy = { extras = ["asyncio"], version = "^2.0.37" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"

faststream = { extras = ["rabbit"], version = "^0.5.34" }

httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
faker = "^33.1.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-httpx = "^0.32.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
ruff = "^0.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # PEP8 errors
    "W",   # PEP8 warnings
    "F",   # Pyflakes
    "I",   # isort
    "Q",   # quotes
    "B",   # bugbear
    "S",   # bandit
    "C90", # complexity
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "T",   # flake8-todos
    "ASYNC",
    "PERF",
    "SIM",
]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S107", "F841"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faststream.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
